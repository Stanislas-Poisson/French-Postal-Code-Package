name: Bug in the package
description: The reader, a model or the load command fails or behaves unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version of the package
      description: For example 4.0.0.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PHP, framework and database
      description: For example PHP 8.3, Laravel 12, MySQL 8.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: Please remove anything private.
      render: text
