name: CI

on:
  pull_request:
  # Started by hand for the pull requests of the Update data workflow, which cannot start it by itself.
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer cs
      - run: composer analyse
      - run: composer rector
      - run: composer insights

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The configuration of markdownlint extends the one of php-dev-tools, which is in vendor/.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer markdown

  security:
    name: Dependencies audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer audit

  test:
    name: Core (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - run: composer install --no-interaction --prefer-dist

      - name: Run the tests
        run: vendor/bin/phpunit --colors=never --coverage-text | tee coverage.txt

      - name: Keep the coverage of src/Core at 100 %
        run: grep -qE '^\s+Lines:\s+100\.00%' coverage.txt

  # The frameworks are not in composer.json: each job installs only its own (see scripts/install-laravel.sh).
  laravel:
    name: Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '11' }
          - { php: '8.3', laravel: '12' }
          - { php: '8.3', laravel: '13' }
          - { php: '8.4', laravel: '11' }
          - { php: '8.4', laravel: '12' }
          - { php: '8.4', laravel: '13' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      # Every release of Laravel 11 is flagged by a security advisory, so Composer refuses to install it by default.
      # The adapter is still tested on it, since it declares to support it.
      - name: Allow Laravel 11, which is no longer maintained
        if: matrix.laravel == '11'
        run: composer config audit.block-insecure false

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer install --no-interaction --prefer-dist
          scripts/install-laravel.sh ${{ matrix.laravel }}

      - name: Static analysis
        run: composer analyse:laravel

      - name: Run the tests
        run: vendor/bin/phpunit --configuration=phpunit.laravel.xml --colors=never --coverage-text | tee coverage.txt

      - name: Keep the coverage of src/Laravel at 100 %
        run: grep -qE '^\s+Lines:\s+100\.00%' coverage.txt

  # Symfony 8 needs PHP 8.4. Doctrine ORM 3 with DBAL 4 everywhere.
  symfony:
    name: Symfony ${{ matrix.symfony }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', symfony: '6.4' }
          - { php: '8.4', symfony: '6.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.4', symfony: '8.0' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install Symfony ${{ matrix.symfony }}
        run: |
          composer install --no-interaction --prefer-dist
          scripts/install-symfony.sh ${{ matrix.symfony }}

      - name: Static analysis
        run: composer analyse:symfony

      - name: Run the tests
        run: vendor/bin/phpunit --configuration=phpunit.symfony.xml --colors=never --coverage-text | tee coverage.txt

      - name: Keep the coverage of src/Symfony at 100 %
        run: grep -qE '^\s+Lines:\s+100\.00%' coverage.txt

  # The adapters on a real server: SQLite hides what MySQL, MariaDB and PostgreSQL refuse (see tests/Support/TestDatabase.php).
  full-data:
    name: ${{ matrix.framework.name }} on ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - { name: Laravel 13, install: 'install-laravel.sh 13', config: phpunit.laravel.xml }
          - { name: Symfony 7.4, install: 'install-symfony.sh 7.4', config: phpunit.symfony.xml }
        database:
          - { name: MySQL 8.4, driver: mysql, image: 'mysql:8.4', port: 3306, user: root, health: 'mysqladmin ping -h 127.0.0.1 -psecret' }
          - { name: MariaDB 11, driver: mariadb, image: 'mariadb:11', port: 3306, user: root, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { name: PostgreSQL 17, driver: pgsql, image: 'postgres:17', port: 5432, user: postgres, health: 'pg_isready -U postgres' }
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: french_postal_code
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: french_postal_code
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: french_postal_code
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB: ${{ matrix.database.driver }}
      TEST_DB_PORT: ${{ matrix.database.port }}
      TEST_DB_USER: ${{ matrix.database.user }}
      TEST_DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install ${{ matrix.framework.name }}
        run: |
          composer install --no-interaction --prefer-dist
          scripts/${{ matrix.framework.install }}

      - name: Run the tests
        run: vendor/bin/phpunit --configuration=${{ matrix.framework.config }} --colors=never

  # The only check required by the branch protection: it fails when any job above failed or was skipped.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [quality, docs, security, test, laravel, symfony, full-data]
    if: always()
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
